<meta charset="utf-8">
<title>Health of Trees</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&display=swap">
<style>
  /* Layout: one-screen app. Tree of text rings fills the left; a narrow column on the right holds title, activity and notifications. */
  :root {
    --paper: #fbfbfa;        /* white paper, single committed colour */
    --ink: #0b0b0b;
    --ink-soft: #6a6a66;
    --font: "Lexend", "Avenir Next", "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background-color: var(--paper); color: var(--ink); font-family: var(--font); font-size: 12px; }
  .app { height: 100%; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
  .stage { position: relative; min-width: 0; min-height: 0; }
  #tree { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .panel {
    padding-block: 32px 24px;
    padding-left: max(28px, env(safe-area-inset-left, 0px));
    padding-right: 12px;
    display: flex; flex-direction: column; gap: 28px;
    overflow-y: auto; min-width: 0;
  }
  h3 { font-weight: 500; font-size: 22px; margin: 0 0 12px; }
  .me { font-size: 11px; font-weight: 500; margin: 0 0 14px; font-variant-numeric: tabular-nums; }
  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; font-size: 11px; font-weight: 500; line-height: 1.25; }
  .log li { overflow-wrap: anywhere; }

  .test { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
  .test-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .readout { margin: 0; font-size: 10.5px; line-height: 1.4; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .readout b { color: var(--ink); font-weight: 500; }
  .small-btn {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: none; border: 0; padding: 4px 0; cursor: pointer;
  }
  .small-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  @media (max-width: 820px) {
    html, body { height: auto; }
    .app { grid-template-columns: 1fr; height: auto; }
    .stage { aspect-ratio: 1; max-width: 100%; order: -1; }
    .panel { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  }
</style>

<div class="app">
  <aside class="panel">
    <section>
      <h3>Notification</h3>
      <p class="me">You are <span id="myId">…</span></p>
      <ul class="log" id="log"></ul>
    </section>

    <section class="test" aria-label="Test controls">
      <p class="readout" id="rateOut" aria-live="off"></p>
      <p class="readout" id="chanceOut" aria-live="off"></p>
      <div class="test-row">
        <button class="small-btn" id="fireBtn">Start a fire</button>
        <button class="small-btn" id="waterBtn"><span aria-hidden="true">↓</span>water</button>
        <button class="small-btn" id="chanceBtn">+25% likelihood</button>
      </div>
    </section>
  </aside>
  <div class="stage" id="stage">
    <canvas id="tree" aria-label="Rings of text about wildfires, turning slowly. Burning words turn into the word fire."></canvas>
  </div>

</div>

<script>
(() => {
  const TAU = Math.PI * 2;
  const FONT = '"Lexend", "Avenir Next", "Helvetica Neue", sans-serif';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);

  // Oldest record at the pith, newest on the bark. Approximate public figures, for visual testing.
  const RECORDS = [
    'Portugal 2017 — about 540,000 hectares burned and 117 lives lost.',
    'California 2018 — the Camp Fire destroyed the town of Paradise, 85 dead.',
    'Australia 2019–20 — the Black Summer burned about 24 million hectares.',
    'Australia 2019–20 — nearly 3 billion animals killed or displaced.',
    'United States 2020 — 10.1 million acres burned.',
    'Russia, Yakutia 2021 — about 8 million hectares of taiga burned.',
    'Greece, Evia 2021 — about 50,000 hectares of forest burned.',
    'Spain 2022 — about 300,000 hectares burned.',
    'Canada 2023 — about 18 million hectares burned in more than 6,000 fires.',
    'Canada 2023 — more than 230,000 people evacuated from their homes.',
    'Hawaii 2023 — Lahaina burned, 102 dead and thousands left homeless.',
    'Greece, Evros 2023 — about 94,000 hectares, the largest fire on EU record.',
    'Chile, Valparaíso 2024 — more than 130 people dead.',
    'Bolivia 2024 — about 10 million hectares burned.',
    'Brazil 2024 — about 30 million hectares of forest and savanna burned.',
    'Portugal 2024 — about 135,000 hectares burned in one week.',
    'Los Angeles 2025 — the Eaton and Palisades fires destroyed more than 16,000 homes and buildings.',
    'Today — about 85% of wildfires in the United States are started by people.',
  ];

  const stage = $('stage');
  const cv = $('tree');
  const ctx = cv.getContext('2d');

  // ---- paper grain --------------------------------------------------------
  (function grain() {
    const g = document.createElement('canvas'); g.width = g.height = 220;
    const gx = g.getContext('2d'); const img = gx.createImageData(220, 220);
    for (let i = 0; i < img.data.length; i += 4) {
      img.data[i] = img.data[i + 1] = img.data[i + 2] = 30;
      img.data[i + 3] = Math.random() * 14;
    }
    gx.putImageData(img, 0, 0);
    gx.strokeStyle = 'rgba(0,0,0,0.035)';
    for (let i = 0; i < 14; i++) {
      gx.beginPath(); const x = Math.random() * 220, y = Math.random() * 220;
      gx.moveTo(x, y); gx.quadraticCurveTo(x + Math.random() * 30 - 15, y + Math.random() * 30 - 15, x + Math.random() * 40 - 20, y + Math.random() * 40 - 20);
      gx.stroke();
    }
    document.body.style.backgroundImage = `url(${g.toDataURL()})`;
  })();

  function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  const shapeSeed = rng(7);
  const harmonics = Array.from({ length: 4 }, (_, k) => ({ k: k + 2, a: [0.045, 0.028, 0.015, 0.008][k], p: shapeSeed() * TAU }));
  function shape(th, i) {
    let m = 1;
    for (const h of harmonics) m += h.a * Math.sin(h.k * th + h.p + i * 0.04);
    return m;
  }

  let W = 0, H = 0, dpr = 1, cx = 0, cy = 0, maxR = 0, fontPx = 10, bigPx = 19;
  let rings = [], ignitions = [], particles = [];
  let regrow = -1, t = 0;

  // ---- glyph widths ------------------------------------------------------
  const widthCache = new Map();
  function charW(ch, size, wt = 400) {
    const key = wt + '/' + size + ch;
    let w = widthCache.get(key);
    if (w === undefined) { ctx.font = `${wt} ${size}px ${FONT}`; w = ctx.measureText(ch).width; widthCache.set(key, w); }
    return w;
  }

  // ---- the fire morph: homeless -> hofeless -> hofiless -> hofireless -> fire ----
  const FIRE_STEPS = 4;
  function wordText(w) {
    if (w.stage === 0) return w.text;
    if (w.stage > FIRE_STEPS) return 'fire';
    const s = w.text, n = s.length, k = w.stage;
    const p = Math.min(Math.max(1, Math.floor(n / 4)), Math.max(0, n - 1));
    return s.slice(0, p) + 'fire'.slice(0, k) + s.slice(Math.min(n, p + Math.min(k, 2)));
  }

  // ---- rings: a few seed rings, then one more for every visitor ---------
  const SEED_RINGS = 6;
  let visitors = ['local'];  // visitor ids in join order; replaced by the shared list when online
  let myId = 'local';
  // STEP 3 · the memory: lines of memory.txt from the server ({ id, text }), one ring each; null without a server
  let memory = null;
  const memoryLines = () => memory.filter(l => l.text.trim());

  function makeRing(i, born) {
    const rand = rng(1000 + i * 7);
    const line = memory ? memoryLines()[i] : null;
    const rec = (line ? line.text : RECORDS[i % RECORDS.length]).split(' ').filter(Boolean);
    return { i, R: 0, rec, owner: line ? line.id : null, k: Math.floor(rand() * rec.length), len: 0, words: [], glyphs: [], dirty: true,
      rot: rand() * TAU, speed: (0.03 - i * 0.0007) * (reduced ? 0 : 1), born, mine: false };
  }
  // enough repeats to wrap the ring, plus spare words that slide in as burning words grow
  function fillWords(r) {
    if (!r.rec.length) return;
    while (r.len < TAU * r.R * 1.6) {
      const text = r.rec[r.k++ % r.rec.length];
      r.words.push({ text, stage: 0, lost: 0, lx: 0, ly: 0, visible: false });
      r.len += (text.length + 1) * fontPx * 0.55;
    }
  }
  function syncRings(born = t) {
    if (!W) return;
    const want = memory ? memoryLines().length : SEED_RINGS + visitors.length;
    const r0 = fontPx * 3.2;
    const gap = Math.max(fontPx * 1.7, Math.min(fontPx * 2.35, (maxR - r0) / Math.max(1, want - 1)));
    const n = Math.min(want, Math.floor((maxR - r0) / gap) + 1); // a full stage stops growing outward
    for (let i = rings.length; i < n; i++) rings.push(makeRing(i, born));
    rings.length = n;
    for (const r of rings) {
      r.R = r0 + r.i * gap;
      r.mine = memory ? r.owner === myId : visitors[r.i - SEED_RINGS] === myId;
      fillWords(r);
      r.dirty = true;
    }
  }

  function build() {
    const rect = stage.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx = W * 0.5; cy = H * 0.5;
    maxR = Math.min(W, H) * 0.47;
    fontPx = maxR > 320 ? 10.5 : 8.5;
    bigPx = Math.round(fontPx * 1.9);
    widthCache.clear();
    rings = [];
    syncRings(-10);
  }

  function layout(ring) {
    const glyphs = [];
    const end = TAU * 0.965; // rings stay slightly open, like the mockup
    const wt = ring.mine ? 600 : 400;
    let th = 0;
    for (const w of ring.words) {
      w.visible = false;
      if (th >= end) continue;
      const size = w.stage > FIRE_STEPS ? bigPx : fontPx;
      const txt = wordText(w);
      const startTh = th;
      let fits = true;
      const placed = [];
      for (const ch of txt) {
        const r = ring.R * shape(th, ring.i);
        const d = charW(ch, size, wt) / r;
        if (th + d > end) { fits = false; break; }
        const mid = th + d / 2;
        const rm = ring.R * shape(mid, ring.i);
        placed.push({ ch, size, wt, lx: Math.cos(mid) * rm, ly: Math.sin(mid) * rm, la: mid + Math.PI / 2 });
        th += d;
      }
      if (!fits) { th = end; continue; }
      glyphs.push(...placed);
      const midW = (startTh + th) / 2, rmW = ring.R * shape(midW, ring.i);
      w.lx = Math.cos(midW) * rmW; w.ly = Math.sin(midW) * rmW; w.visible = true;
      th += charW(' ', fontPx) * 1.1 / ring.R;
    }
    ring.glyphs = glyphs;
    ring.dirty = false;
  }

  // ---- notifications ------------------------------------------------------
  const handle = id => 'User' + (100000 + Math.abs([...id].reduce((h, c) => (h * 31 + c.charCodeAt(0)) | 0, 7)) % 900000);
  let me = 'User' + Math.floor(100000 + Math.random() * 900000);
  function addLog(msg) {
    const li = document.createElement('li');
    li.textContent = msg;
    const log = $('log'); log.prepend(li);
    while (log.children.length > 8) log.lastChild.remove();
  }
  const clean = s => s.replace(/[.,—]/g, '');
  let lastBurnLog = 0;

  // ---- fire ----------------------------------------------------------------
  function ignite(x, y, r0 = 0) { ignitions.push({ x, y, r: r0 }); }
  function randomEdgePoint() {
    // somewhere in the outer half of the tree, however big it has grown
    const outer = rings.length ? rings[rings.length - 1].R + fontPx : maxR;
    const a = Math.random() * TAU, r = outer * (0.5 + Math.random() * 0.45);
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  }

  function health() {
    let all = 0, alive = 0;
    for (const r of rings) for (const w of r.words) if (w.visible) { all++; if (w.stage === 0) alive++; }
    return all ? alive / all : 1;
  }
  // ---- STEP 1 · rate of burning, in characters lost per second -----------------
  //   rate = BASE × time × near × device × water
  //   time   1 → 3    grows by 0.1 for every minute on the page (capped at 20 minutes)
  //   near   1 or 1.5 1.5 when a satellite saw a fire within NEAR_KM of the visitor in the last 7 days (GWIS)
  //   device 1 → 2    how hard the device is working, measured from the time between animation frames
  //   water  0.2 → 1  water drops it to 0.2, and it comes back to 1 over WATER_S seconds
  const BASE = 2, NEAR_KM = 50, WATER_S = 30;
  const opened = performance.now();
  let lastWater = -Infinity;   // seconds (t) when water was last added, by anyone
  let nearestKm = null;        // distance to the closest fire seen in the last 7 days, null when unknown
  let frameMs = 16.7;          // smoothed time between frames
  let charsLost = 0;

  function burnFactors() {
    const minutes = (performance.now() - opened) / 60000;
    const time = 1 + Math.min(minutes, 20) / 10;
    const near = nearestKm !== null && nearestKm <= NEAR_KM ? 1.5 : 1;
    const device = 1 + Math.min(1, Math.max(0, (frameMs - 20) / 30)); // 50 fps or better = 1, 20 fps or worse = 2
    const water = 0.2 + 0.8 * Math.min(1, (t - lastWater) / WATER_S);
    return { time, near, device, water, rate: BASE * time * near * device * water };
  }

  // ---- STEP 2 · likelihood of a fire starting, in percent ---------------------
  // Only grows while nothing is burning. At 100% a fire starts and it goes back to 0.
  //   per minute = P_BASE × near × danger × device × tab
  //   near    1 → 3    3 with a fire right next to the visitor, falling to 1 at 150 km or more (GWIS hotspots, 7 days)
  //   danger  0.5 → 6  today's EFFIS Fire Danger class at the visitor's location (from the Fire Weather Index)
  //   device  1 → 2    same measure as the rate of burning
  //   tab     1 → 3    grows with the time the page has been open (capped at 30 minutes), ×2 while the tab is in the background
  const P_BASE = 2;
  const DANGER = [ // EFFIS classes: name, lowest FWI, weight
    ['Very low', -Infinity, 0.5], ['Low', 5.2, 1], ['Moderate', 11.2, 1.5],
    ['High', 21.3, 2.5], ['Very high', 38, 4], ['Extreme', 50, 6],
  ];
  let fwi = null;       // today's Fire Weather Index at the visitor's location, null when unknown
  let likelihood = 0;   // percent
  const dangerOf = v => DANGER.reduce((cls, c) => v >= c[1] ? c : cls, DANGER[0]);

  function fireFactors() {
    const near = nearestKm === null ? 1 : 1 + 2 * Math.max(0, 1 - nearestKm / 150);
    const danger = fwi === null ? 1 : dangerOf(fwi)[2];
    const device = 1 + Math.min(1, Math.max(0, (frameMs - 20) / 30));
    const minutes = (performance.now() - opened) / 60000;
    const tab = (1 + Math.min(minutes, 30) / 15) * (document.hidden ? 2 : 1);
    return { near, danger, device, tab, perMin: P_BASE * near * danger * device * tab };
  }

  // a timer rather than the animation, so it keeps counting when the visitor clicks away from the tab
  let lastTick = Date.now();
  setInterval(() => {
    const now = Date.now(), minutes = (now - lastTick) / 60000; lastTick = now;
    if (!ignitions.length && regrow < 0 && health() >= 0.03) {
      likelihood = Math.min(100, likelihood + fireFactors().perMin * minutes);
      if (likelihood >= 100) { addLog('The likelihood of fire reached 100%'); startFire(); }
    }
    readouts();
  }, 1000);

  // characters a word loses at each step: five steps, then nothing is left
  const stepCost = w => Math.min(w.text.length - w.lost, Math.ceil(w.text.length / (FIRE_STEPS + 1)));

  // saving puts burning words back to their original text
  function saveBurning(chance) {
    let saved = null;
    for (const r of rings) for (const w of r.words) {
      if (w.stage > 0 && w.stage <= FIRE_STEPS && Math.random() < chance) { w.stage = 0; w.lost = 0; r.dirty = true; saved = saved || w.text; }
    }
    return saved;
  }

  function water(user, remote) {
    const who = user || me;
    if (!remote) post('water');
    if (health() < 0.03 && memory) {
      addLog(`${who} added water, but the memory is gone · only new visitors grow new rings`);
      return;
    }
    if (health() < 0.03) {
      regrow = 0; ignitions = [];
      addLog(`${who} just added water · the forest grows back`);
      return;
    }
    lastWater = t;
    ignitions.forEach(ig => ig.r *= 0.8);
    const saved = saveBurning(0.75);
    addLog(`${who} just added water`);
    if (saved) addLog(`${who} saved the word «${clean(saved)}»`);
  }

  function startFire(user, remote) {
    if (health() < 0.03 || regrow >= 0) return;
    const [x, y] = randomEdgePoint(); ignite(x, y, Math.max(maxR * 0.06, (rings.length ? rings[rings.length - 1].R : maxR) * 0.15));
    likelihood = 0;
    addLog(`${user || me} started a fire`);
    if (!remote) post('fire');
  }

  function smoke(x, y) { return { x, y, vx: (Math.random() - 0.5) * 8, vy: -10 - Math.random() * 14, life: 1, decay: 0.25 + Math.random() * 0.2 }; }

  // ---- loop --------------------------------------------------------------
  let last = performance.now();
  function frame(now) {
    const gapMs = now - last;
    const dt = Math.min(0.05, gapMs / 1000); last = now; t += dt;
    if (!document.hidden && gapMs < 1000) frameMs += (gapMs - frameMs) * 0.05;

    const f = burnFactors();
    for (const ig of ignitions) ig.r += dt * 8 * f.rate;
    if (ignitions.length) burnBudget += f.rate * Math.min(1, gapMs / 1000); // real time, so slow frames don't burn less
    const burning = [], inFront = [];

    // regrowth: rings return from the pith outward
    if (regrow >= 0) {
      regrow += dt * 0.15;
      const upto = regrow * rings.length;
      for (const r of rings) if (r.i < upto) for (const w of r.words) if (w.stage !== 0) { w.stage = 0; r.dirty = true; }
      if (regrow >= 1) { regrow = -1; addLog('A new ring has grown · memory can be added again'); }
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#0b0b0b';
    ctx.globalAlpha = 1;

    for (const r of rings) {
      r.rot += r.speed * dt;
      const cs = Math.cos(r.rot), sn = Math.sin(r.rot);

      // words that are burning, and words the fire front has reached
      if (ignitions.length) for (const w of r.words) {
        if (!w.visible) continue;
        const x = cx + w.lx * cs - w.ly * sn, y = cy + w.lx * sn + w.ly * cs;
        if (w.stage > 0 && w.stage <= FIRE_STEPS) burning.push({ w, r, x, y });
        else if (w.stage === 0 && ignitions.some(ig => (x - ig.x) ** 2 + (y - ig.y) ** 2 < ig.r * ig.r)) inFront.push({ w, r, x, y });
      }
      if (r.dirty) layout(r);

      // a new visitor's ring fades in
      ctx.globalAlpha = Math.min(1, Math.max(0, (t - r.born) / 2.5));
      let font = '';
      for (const g of r.glyphs) {
        const f = `${g.wt} ${g.size}px ${FONT}`;
        if (f !== font) { font = f; ctx.font = f; }
        const x = cx + g.lx * cs - g.ly * sn, y = cy + g.lx * sn + g.ly * cs;
        const ang = g.la + r.rot;
        const co = Math.cos(ang), si = Math.sin(ang);
        ctx.setTransform(dpr * co, dpr * si, -dpr * si, dpr * co, x * dpr, y * dpr);
        ctx.fillText(g.ch, 0, 0);
      }
    }

    spendBudget(burning, inFront);

    ctx.globalAlpha = 1;
    // smoke: plain black dots that rise and drift with the breath
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `400 ${fontPx}px ${FONT}`;
    const wind = 0;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += (p.vx + wind) * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillText('•', p.x, p.y);
    }
    if (particles.length > 500) particles.splice(0, particles.length - 500);

    if (ignitions.length && ignitions.every(ig => ig.r > maxR * 2.6)) ignitions = [];
    updateHud();
    requestAnimationFrame(frame);
  }

  // the fire eats exactly `rate` characters per second: each character either moves a burning
  // word one step closer to "fire", or sets a new word in the fire front alight
  let burnBudget = 0;
  function spendBudget(burning, inFront) {
    while (burnBudget >= 1) {
      const spread = inFront.length && (!burning.length || Math.random() < 0.35);
      const pick = spread ? inFront.splice(Math.floor(Math.random() * inFront.length), 1)[0]
                          : burning.length ? burning[Math.floor(Math.random() * burning.length)] : null;
      // nothing in reach: the front widens so the fire keeps its rate
      if (!pick) { ignitions.forEach(ig => ig.r += 6); burnBudget = Math.min(burnBudget, 20); return; }
      const { w, r, x, y } = pick;
      const cost = stepCost(w);
      w.lost += cost; w.stage++; r.dirty = true;
      burnBudget -= cost; charsLost += cost;
      if (w.stage === 1) {
        burning.push(pick);
        if (t - lastBurnLog > 2.5) { lastBurnLog = t; addLog(`The word «${clean(w.text)}» is burning`); }
      } else if (w.stage > FIRE_STEPS) {
        burning.splice(burning.indexOf(pick), 1);
        if (r.owner && net && net.burn) net.burn(r.owner, w.text); // deleted from memory.txt
      }
      for (let k = 0; k < 2; k++) particles.push(smoke(x + (Math.random() - 0.5) * 10, y));
    }
  }

  // test readouts for steps 1 and 2
  function readouts() {
    const f = burnFactors();
    const near = nearestKm === null ? 'location not shared' : `nearest fire ${Math.round(nearestKm)} km`;
    $('rateOut').innerHTML =
      `<b>${ignitions.length ? 'Burning' : 'No fire · would burn'} ${f.rate.toFixed(1)} characters/second</b><br>` +
      `${BASE} × time ${f.time.toFixed(2)} × near ${f.near} × device ${f.device.toFixed(2)} × water ${f.water.toFixed(2)}<br>` +
      `${near} · ${Math.round(1000 / frameMs)} fps · ${charsLost} characters lost`;
    const p = fireFactors();
    const danger = fwi === null ? 'unknown' : `${dangerOf(fwi)[0]}, FWI ${fwi.toFixed(1)}`;
    $('chanceOut').innerHTML =
      `<b>Fire likelihood ${Math.floor(likelihood)}%${ignitions.length ? ' · paused while burning' : ` · +${p.perMin.toFixed(1)}% a minute`}</b><br>` +
      `${P_BASE} × near ${p.near.toFixed(2)} × danger ${p.danger} × device ${p.device.toFixed(2)} × tab ${p.tab.toFixed(2)}<br>` +
      `fire danger today: ${danger}`;
  }

  let hudTick = 0, wasBurned = false;
  const showId = () => { $('myId').textContent = me; };
  function updateHud() {
    if (++hudTick % 10) return;
    const h = health();
    const burned = h < 0.03;
    if (burned && !wasBurned) addLog('All memory has been lost · add water to grow it back');
    wasBurned = burned;
  }

  // ---- shared forest: visitors and actions reach everyone with the link ----
  // On claude.ai it uses the artifact database; anywhere else it uses the Socket.IO server (server.js).
  // Empty means the server that served this page. On GitHub Pages, put your server's address here,
  // for example 'https://health-of-trees.onrender.com'.
  const SOCKET_SERVER = '';
  const TAB = Math.random().toString(36).slice(2);
  const TYPES = ['water', 'fire', 'help'];
  let net = null; // { send(type) } once connected

  function post(type) { if (net) net.send(type); }

  function applyRemote(ev) {
    const who = typeof ev.by === 'string' ? handle(ev.by) : 'Someone';
    if (ev.type === 'water') water(who, true);
    else if (ev.type === 'fire') startFire(who, true);
    else if (ev.type === 'help') addLog(`${who} asks for help · add water!`);
  }
  function describe(ev) {
    const who = typeof ev.by === 'string' ? handle(ev.by) : 'Someone';
    return ev.type === 'water' ? `${who} just added water` : ev.type === 'fire' ? `${who} started a fire` : `${who} asked the community for help`;
  }

  async function connectShared() {
    if (!window.claude || !window.claude.use) return connectSocket();
    const [d, user] = await Promise.all(['db', 'user'].map(n => window.claude.use(n).catch(() => null)));
    const id = user ? await user.id() : null;
    if (!d || !id) return;
    const db = d; myId = id; me = handle(id); showId();
    net = { send: type => db.collection('events').add({ type, by: myId, tab: TAB, at: Date.now() })
      .catch(() => addLog('You can watch, but this link does not let you act for everyone')) };

    let first = true;
    db.collection('visitors').orderBy('first').onSnapshot(snap => {
      visitors = snap.docs.map(doc => doc.id);
      if (!first) for (const c of snap.docChanges()) if (c.type === 'added') addLog(`${c.doc.id === myId ? me : handle(c.doc.id)} joined · a new ring grows`);
      syncRings(first ? -10 : t);
      first = false;
    }, () => {});

    const mine = db.doc('visitors/' + myId);
    mine.get().then(s => s.exists ? (addLog(`${me} came back`), mine.update({ last: Date.now() })) : mine.set({ first: Date.now(), last: Date.now() }))
      .catch(() => {});

    let firstEv = true;
    db.collection('events').orderBy('at', 'desc').limit(8).onSnapshot(snap => {
      if (firstEv) { [...snap.docs].reverse().forEach(doc => { const ev = doc.data(); if (TYPES.includes(ev.type)) addLog(describe(ev)); }); firstEv = false; return; }
      for (const c of snap.docChanges()) {
        const ev = c.doc.data();
        if (c.type === 'added' && ev && ev.tab !== TAB && TYPES.includes(ev.type)) applyRemote(ev);
      }
    }, () => {});

    // keep the shared log small
    db.collection('events').orderBy('at').get().then(snap => {
      snap.docs.slice(0, Math.max(0, snap.size - 60)).forEach(doc => db.doc('events/' + doc.id).delete().catch(() => {}));
    }).catch(() => {});
  }

  // ---- Socket.IO: live forest on GitHub Pages or any host --------------------
  function connectSocket() {
    if (location.protocol === 'file:' && !SOCKET_SERVER) return;
    const base = (SOCKET_SERVER || location.origin).replace(/\/$/, '');
    const s = document.createElement('script');
    s.src = base + '/socket.io/socket.io.js'; // served by the Socket.IO server itself, so versions always match
    s.onload = () => startSocket(base);
    s.onerror = () => {}; // no server reachable: stay a single-visitor forest
    document.head.append(s);
  }

  function startSocket(base) {
    // the same browser keeps the same ID, so coming back doesn't add a second ring
    let id = null;
    try { id = localStorage.getItem('health-of-trees-id'); } catch {}
    if (!id || !/^[a-z0-9]{6,32}$/.test(id)) {
      id = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 8);
      try { localStorage.setItem('health-of-trees-id', id); } catch {}
    }
    myId = id; me = handle(id); showId();

    const sock = io(base);
    net = { send: type => sock.emit('action', type), burn: (owner, word) => sock.emit('burn', { owner, word }) };
    const isLine = l => l && typeof l.id === 'string' && typeof l.text === 'string';
    let first = true;
    sock.on('connect', () => sock.emit('hello', id));
    sock.on('init', d => {
      if (!first) return; // a reconnect: this screen already shows the memory
      first = false;
      memory = (Array.isArray(d.memory) ? d.memory : []).filter(isLine);
      visitors = memory.map(l => l.id);
      rings = []; syncRings(-10);
      for (const ev of Array.isArray(d.events) ? d.events : []) if (ev && TYPES.includes(ev.type)) addLog(describe(ev));
      if (d.hasLine) addLog(`${me} came back`);
      else placeReady.then(place => sock.emit('place', place));
      if (memory.length && !memoryLines().length) addLog('All memory has been lost · new visitors grow new rings');
    });
    // a new visitor's line was written to memory.txt
    sock.on('line', l => {
      if (!memory || !isLine(l) || memory.some(m => m.id === l.id)) return;
      memory.push(l); visitors.push(l.id); syncRings();
      addLog(`${l.id === myId ? me : handle(l.id)} joined · a new ring grows`);
    });
    sock.on('action', ev => { if (ev && TYPES.includes(ev.type)) applyRemote(ev); });
  }

  // ---- proximity to wildfires: satellite hotspots from GWIS (EFFIS / Copernicus) -----
  const GWIS = 'https://maps.effis.emergency.copernicus.eu/gwis';
  function kmBetween(a, b, c, d) {
    const R = 6371, rad = Math.PI / 180;
    const x = Math.sin((c - a) * rad / 2) ** 2 + Math.cos(a * rad) * Math.cos(c * rad) * Math.sin((d - b) * rad / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  async function findNearestFire(lat, lon) {
    // a box about 300 km wide; with EPSG:4326 the WFS 1.1.0 box is lat,lon order
    const dLat = 1.5, dLon = 1.5 / Math.max(0.2, Math.cos(lat * Math.PI / 180));
    const url = `${GWIS}?service=WFS&version=1.1.0&request=GetFeature&typename=ms:all.hs.week.points&srsName=EPSG:4326&outputFormat=geojson` +
      `&BBOX=${lat - dLat},${lon - dLon},${lat + dLat},${lon + dLon},EPSG:4326`;
    const data = await (await fetch(url)).json();
    let best = Infinity;
    for (const ft of data.features || []) {
      const [fx, fy] = ft.geometry.coordinates;
      best = Math.min(best, kmBetween(lat, lon, fy, fx));
    }
    return best; // Infinity: no fire within about 150 km
  }
  // today's Fire Weather Index from the ECMWF fire danger layer
  async function findFireDanger(lat, lon) {
    const day = new Date().toISOString().slice(0, 10);
    const url = `${GWIS}?service=WMS&version=1.3.0&request=GetFeatureInfo&layers=ecmwf.query&query_layers=ecmwf.query&styles=` +
      `&crs=EPSG:4326&width=3&height=3&i=1&j=1&info_format=text/html&time=${day}` +
      `&bbox=${lat - 0.1},${lon - 0.1},${lat + 0.1},${lon + 0.1}`;
    const m = (await (await fetch(url)).text()).match(/\(FWI\)<\/td><td>([-\d.]+)/);
    return m ? +m[1] : null; // null over the sea or when the day isn't published yet
  }

  // where the visitor is, for their line of memory: rounded coordinates and the city of their time zone, or null
  let placeFound;
  const placeReady = new Promise(res => { placeFound = res; setTimeout(() => res(null), 20000); });
  const tzCity = () => { try { return (Intl.DateTimeFormat().resolvedOptions().timeZone || '').split('/').pop().replace(/_/g, ' '); } catch { return ''; } };

  function locate() {
    if (!navigator.geolocation) return placeFound({ city: tzCity() });
    navigator.geolocation.getCurrentPosition(async pos => {
      // rounded to about 1 km before it leaves the browser
      const lat = +pos.coords.latitude.toFixed(2), lon = +pos.coords.longitude.toFixed(2);
      placeFound({ lat, lon, city: tzCity() });
      try {
        nearestKm = await findNearestFire(lat, lon);
        addLog(nearestKm <= NEAR_KM ? `${me} lives ${Math.round(nearestKm)} km from a wildfire · burning is faster` : `${me} lives far from this week's wildfires`);
      } catch { /* GWIS unreachable: proximity stays unknown */ }
      try {
        fwi = await findFireDanger(lat, lon);
        if (fwi !== null) addLog(`Fire danger for ${me} today: ${dangerOf(fwi)[0]}`);
      } catch { /* danger stays unknown */ }
    }, () => placeFound({ city: tzCity() }), { maximumAge: 3600000, timeout: 15000 });
  }

  // ---- wiring ------------------------------------------------------------
  $('waterBtn').addEventListener('click', () => water());
  $('fireBtn').addEventListener('click', () => startFire());
  $('chanceBtn').addEventListener('click', () => { if (!ignitions.length) likelihood = Math.min(99.9, likelihood + 25); });

  let resizeT;
  new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(build, 120); }).observe(stage);

  const go = () => {
    build();
    showId();
    connectShared().catch(() => {});
    locate();
    requestAnimationFrame(t0 => { last = t0; requestAnimationFrame(frame); });
  };
  (document.fonts ? Promise.all([document.fonts.load('400 10px "Lexend"'), document.fonts.load('500 10px "Lexend"')]).catch(() => {}) : Promise.resolve()).then(go, go);
})();
</script>
